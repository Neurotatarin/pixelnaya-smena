name: store
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'native/**', 'package.json', 'capacitor.config.json', '.github/workflows/store.yml']
permissions:
  contents: read
concurrency:
  group: store
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Capacitor Android
        run: bash native/prepare.sh android
      - name: Build AAB and test APK
        run: |
          cd native-android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon
          mkdir -p ../out
          cp app/build/outputs/bundle/release/*.aab ../out/pixelnaya-smena-store.aab
          cp app/build/outputs/apk/debug/*.apk ../out/pixelnaya-smena-store-test.apk
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: android-store
          path: out/
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "Xcode 26 not found on this runner"; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Prepare Capacitor iOS
        run: bash native/prepare.sh ios
      - name: Build for iOS Simulator
        run: |
          cd native-ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Run in Simulator and take screenshots
        run: |
          APP=$(find native-ios/App/build/Build/Products -name "App.app" -path "*iphonesimulator*" | head -1)
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9]|iPhone 2" | grep -v Plus | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEV app $APP"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.pixelsmena.game
          sleep 12
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/ios-menu.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: shots/
